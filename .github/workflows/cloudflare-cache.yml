name: Invalidar caché de SOS en Cloudflare

on:
  workflow_run:
    # workflow.name de la API; el nombre visible de sus runs usa espacios.
    workflows: [pages-build-deployment]
    types: [completed]
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-cache-sos
  cancel-in-progress: false

jobs:
  purgar:
    name: Purgar SOS y verificar la portada
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'gh-pages' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener únicamente código de la rama predeterminada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar publicación, purgar y verificar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
        run: node .github/scripts/purge-cloudflare.cjs
